<extend template="base.shtml">
<title id="title" :text="$page.title"></title>
<head id="head"></head>
<div id="content">
  <header class="page-title">
    <h1 :text="$page.title"></h1>
    <ctx alt="$page.alternative('rss')">
      <a class="rss" href="$ctx.alt.link()" type="$ctx.alt.type" title="RSS feed" aria-label="RSS feed">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 2.75A.75.75 0 0 1 2.75 2C8.963 2 14 7.037 14 13.25a.75.75 0 0 1-1.5 0A9.75 9.75 0 0 0 2.75 3.5.75.75 0 0 1 2 2.75Zm0 4.5a.75.75 0 0 1 .75-.75 6.75 6.75 0 0 1 6.75 6.75.75.75 0 0 1-1.5 0C8 10.35 5.65 8 2.75 8A.75.75 0 0 1 2 7.25ZM3 11a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"/></svg>
      </a>
    </ctx>
  </header>
  <div class="lede" :html="$page.content()"></div>
  <div class="post-list" :loop="$page.subpages()">
    <div class="post-item">
      <time :text="$loop.it.date.format('Jan 02, 2006')"></time>
      <div>
        <a class="title" href="$loop.it.link()" :text="$loop.it.title"></a>
        <p :if="$loop.it.description.len().gt(0)" :text="$loop.it.description"></p>
      </div>
    </div>
  </div>
</div>
<footer id="footer"></footer>
