<extend template="base.shtml">
<title id="title" :text="$page.title"></title>
<head id="head">
  <link type="text/css" rel="stylesheet" href="$site.asset('term-highlight.css').link()">
</head>
<div id="content">
  <article>
    <header class="post-header">
      <h1 :text="$page.title"></h1>
      <div class="meta">
        <time :text="$page.date.format('January 02, 2006')"></time>
        ·
        <span :text="$page.wordCount().div(220).plus(1)"></span>
        min read · by
        <span :text="$page.author"></span>
        <span :if="$page.custom.get?('coauthor')">
          and
          <a href="$page.custom.get('coauthor_link')" target="_blank" :text="$if"></a>
        </span>
      </div>
      <div class="tags" :loop="$page.tags">
        <span class="tag" :text="$loop.it"></span>
      </div>
      <div id="post-description" :html="$page.description"></div>
    </header>
    <div :if="$page.custom.getOr('toc', false)">
      <div class="block toc">
        <h1>Contents</h1>
        <div :html="$page.toc()"></div>
      </div>
    </div>
    <div id="post-body" :html="$page.content()"></div>
    <div id="footnotes">
      <ctx :if="$page.footnotes?()">
        <hr>
        <ol :loop="$if">
          <li id="$loop.it.def_id">
            <ctx :html="$loop.it.html()"></ctx>
          </li>
        </ol>
      </ctx>
    </div>
    <hr>
    <nav class="prev-next">
      <ctx :if="$page.prevPage?()">
        <a class="prev" href="$if.link()"><small>← previous</small><span :text="$if.title"></span></a>
      </ctx>
      <ctx :if="$page.nextPage?()">
        <a class="next" href="$if.link()"><small>next →</small><span :text="$if.title"></span></a>
      </ctx>
    </nav>
  </article>
</div>
<footer id="footer"></footer>
