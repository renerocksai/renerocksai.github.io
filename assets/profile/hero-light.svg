<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Rene Schallner: software engineer turned AI researcher and engineer. I build the tools I use every day.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f6f8fa"/><stop offset="1" stop-color="#ffffff"/>
  </linearGradient>
  <linearGradient id="boltfill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffc233"/><stop offset="1" stop-color="#f08c00"/>
